<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="/css/tailwind.css" rel="stylesheet"/>
<link href="/css/portal.css" rel="stylesheet"/>
<title>Auto Upload — 文件上传台</title>
<style>
.cos-page{padding-top:0}
.page-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:32px;margin-bottom:18px}
.hero-kicker{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--c-text-3);margin-bottom:10px}
.hero-title{font-family:var(--font-display);font-size:38px;font-weight:800;letter-spacing:-.06em;line-height:.96;color:var(--c-text);margin:0}
.hero-subtitle{max-width:700px;font-size:14px;line-height:1.7;color:var(--c-text-2);margin:10px 0 0}
.cos-section{background:linear-gradient(180deg,rgba(255,252,245,.95),rgba(250,246,237,.96));border:1px solid var(--c-border);border-radius:22px;padding:20px 20px 18px;box-shadow:var(--shadow-sm)}
.section-title{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.04em;color:var(--c-text);margin:0}
.section-copy{font-size:13px;line-height:1.65;color:var(--c-text-3);margin:8px 0 0}
.drop-box{border:1.5px dashed rgba(22,19,15,.16);border-radius:18px;padding:30px 22px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(255,252,245,.72)}
.drop-box:hover{border-color:rgba(180,234,88,.52);background:rgba(180,234,88,.08)}
.drop-box.dragover{border-color:var(--c-accent);background:rgba(180,234,88,.14)}
.drop-box.done{border-color:#a7f3d0;background:#f0fdf4;cursor:default}

.tab-btn{padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;border:1px solid transparent;background:rgba(255,252,245,.72);color:var(--c-text-2)}
.tab-btn.active{background:var(--c-ink);color:#f9f6ee;border-color:transparent}
.tab-btn:hover:not(.active){background:rgba(22,19,15,.06);color:var(--c-text)}

.stat-card{border-radius:18px;padding:16px 18px;text-align:left;min-width:120px;background:rgba(255,252,245,.78);border:1px solid rgba(22,19,15,.08);box-shadow:var(--shadow-xs)}
.stat-card .num{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:.95}
.stat-card .label{font-size:11px;color:var(--c-text-3);margin-top:8px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}

.group-block{border:1px solid var(--c-border);border-radius:10px;overflow:hidden;margin-bottom:8px}
.group-head{padding:10px 14px;background:var(--c-surface-alt);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.group-body{display:none;padding:8px 14px}
.group-block.open .group-body{display:block}

.severity-ok{color:#22c55e}
.severity-warning{color:#f59e0b}
.severity-error{color:#ef4444}
.severity-ignored{color:#9ca3af}

.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-ok{background:#dcfce7;color:#166534}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-error{background:#fee2e2;color:#991b1b}
.badge-ignored{background:#f3f4f6;color:#6b7280}
.badge-method{background:#ede9fe;color:#5b21b6}

table.item-table{width:100%;font-size:13px;border-collapse:collapse}
table.item-table th{text-align:left;padding:6px 8px;border-bottom:1px solid #e5e5ea;font-weight:600;color:#6e6e73;font-size:12px}
table.item-table td{padding:6px 8px;border-bottom:1px solid #f2f2f7;vertical-align:top}

.progress-bar{height:6px;border-radius:3px;background:#f2f2f7;overflow:hidden}
.progress-fill{height:100%;background:#22c55e;transition:width .3s}
.detail-card{border:1px solid #e5e7eb;border-radius:10px;padding:14px;background:#fafafa;margin-top:12px}
.status-chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}

.blocking-note{border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,rgba(255,245,245,.94),rgba(255,241,242,.92));border:1px solid #fecaca;color:#b42318;font-size:13px;line-height:1.6}
.group-head-note{font-size:11px;color:var(--c-text-3)}
.status-note-error{font-size:11px;color:#b42318;margin-top:4px}
.status-note-warn{font-size:11px;color:#9a6700;margin-top:4px}
.table-path{font-size:12px;color:var(--c-text-3)}
.upload-status-ok{color:#1f7a45;font-weight:700}
.upload-status-error{color:#b42318;font-weight:700}
.upload-status-muted{color:var(--c-text-3);font-weight:600}
.section-divider{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.action-btn{padding:8px 18px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .15s;border:1px solid transparent}
.action-btn.primary{background:var(--c-accent);color:var(--c-ink)}
.action-btn.primary:hover{filter:brightness(1.03)}
.action-btn.secondary{background:rgba(255,252,245,.82);color:var(--c-text);border-color:rgba(22,19,15,.1)}
.action-btn.secondary:hover{background:rgba(22,19,15,.06)}
.action-btn.warn{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
.action-btn.warn:hover{background:#ffedd5}
.action-btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
@media (max-width: 960px){
  .hero-title{font-size:32px}
}
</style>
</head>
<body>

<header class="hdr"></header>

<main class="cos-page max-w-5xl mx-auto px-4 py-6">
<section class="page-hero">
  <div>
    <div class="hero-kicker">Auto Upload</div>
    <h1 class="hero-title">文件上传台</h1>
    <p class="hero-subtitle">上传 zip 包，自动分类预检，确认后批量上传至 MinIO 对象存储。</p>
  </div>
</section>

<!-- ════════════════════════════════════════════════════════ -->
<!-- SECTION 1: 上传准备 -->
<!-- ════════════════════════════════════════════════════════ -->
<section id="sec-prepare" class="cos-section mb-8">
  <div class="section-divider">
    <div>
      <h2 class="section-title">上传准备</h2>
      <p class="section-copy">选择或拖放 zip 文件，上传后自动解压并等待分类。</p>
    </div>
  </div>

  <div id="dz-zip" class="drop-box" onclick="document.getElementById('inp-zip').click()">
    <input type="file" id="inp-zip" accept=".zip" class="hidden" onchange="onZipSelected(this.files[0])"/>
    <p class="text-sm text-gray-500">拖放或点击选择 .zip 文件</p>
    <p id="zip-info" class="text-xs text-gray-400 mt-1"></p>
  </div>

  <div class="mt-4">
    <button id="btn-classify" class="action-btn primary" disabled onclick="startClassify()">
      开始自动分类
    </button>
    <span id="classify-spinner" class="ml-2 text-sm text-gray-400" style="display:none">分类中...</span>
  </div>
</section>

<!-- ════════════════════════════════════════════════════════ -->
<!-- SECTION 2: 分类预览（强制） -->
<!-- ════════════════════════════════════════════════════════ -->
<section id="sec-preview" class="cos-section mb-8" style="display:none">
  <div class="section-divider">
    <div>
      <h2 class="section-title">分类预览</h2>
      <p class="section-copy">正式上传前必须先看预览，确认接收方、文档类型、路径和错误分组。</p>
    </div>
  </div>

  <div id="preview-stats" class="flex gap-3 mb-4 flex-wrap"></div>
  <div id="preview-blocking" class="blocking-note" style="display:none"></div>

  <div class="flex gap-2 mb-3">
    <button class="tab-btn active" onclick="switchPreviewGroup('target', this)">按接收方</button>
    <button class="tab-btn" onclick="switchPreviewGroup('category', this)">按分类</button>
    <button class="tab-btn" onclick="switchPreviewGroup('severity', this)">按状态</button>
  </div>

  <div id="preview-groups"></div>

  <div class="flex gap-3 mt-4">
    <button id="btn-confirm" class="action-btn primary" disabled onclick="confirmUpload()">
      确认上传
    </button>
    <button class="action-btn secondary" onclick="startClassify()">
      重新分类
    </button>
  </div>
</section>

<!-- ════════════════════════════════════════════════════════ -->
<!-- SECTION 3: 执行结果 -->
<!-- ════════════════════════════════════════════════════════ -->
<section id="sec-result" class="cos-section mb-8" style="display:none">
  <div class="section-divider">
    <div>
      <h2 class="section-title">上传执行</h2>
      <p class="section-copy">实时显示上传进度，失败项可重试。</p>
    </div>
  </div>

  <div class="mb-3">
    <div class="progress-bar"><div id="upload-progress-fill" class="progress-fill" style="width:0%"></div></div>
    <div id="upload-progress-text" class="text-xs text-gray-500 mt-1"></div>
  </div>

  <div id="upload-stats" class="flex gap-3 mb-4 flex-wrap"></div>
  <div id="upload-items"></div>

  <div class="flex gap-3 mt-4">
    <button id="btn-retry" class="action-btn warn" style="display:none" onclick="retryFailed()">
      重试失败项
    </button>
  </div>
</section>

</main>

<script src="/js/utils/dom.js"></script>
<script src="/js/utils/format.js"></script>
<script src="/js/utils/api.js"></script>
<script src="/js/components/nav.js"></script>
<script src="/js/components/status-vocab.js"></script>
<script src="/js/components/toast.js"></script>
<div id="app-toast"></div>
<script>
PortalNav.render();
const API = '/api/v1';

// ── 全局状态 ──
let currentTaskId = null;
let previewItems = [];
let previewSummary = {};
let _sseSource = null;
let _uploadDone = 0;
let _uploadTotal = 0;
let _uploadFailed = 0;

const esc = PortalDom.esc;
const fmtSize = PortalFormat.fmtBytes;
const showToast = PortalToast.makeFloatingToast('app-toast', {
  duration: 4000,
  baseStyle: `
    position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:10px;
    font-size:13px;font-weight:600;z-index:200;opacity:0;
    transform:translateY(8px);transition:all .25s;pointer-events:none;
    max-width:360px;line-height:1.4;
  `,
});

// ═══════════════════════════════════════════════════════════
// 上传准备
// ═══════════════════════════════════════════════════════════

async function onZipSelected(file) {
  if (!file || !file.name.endsWith('.zip')) {
    showToast('请选择 .zip 文件', 'err');
    return;
  }
  const dz = document.getElementById('dz-zip');
  dz.classList.add('done');
  document.getElementById('zip-info').textContent = `${file.name} (${fmtSize(file.size)}) — 上传中...`;

  const fd = new FormData();
  fd.append('file', file);

  try {
    const d = await PortalApi.sendForm(`${API}/tasks`, fd, { method: 'POST' });
    currentTaskId = d.task_id;
    document.getElementById('zip-info').textContent =
      `${file.name} (${fmtSize(file.size)}) — Task: ${d.task_id}`;
    document.getElementById('btn-classify').disabled = false;
  } catch (e) {
    dz.classList.remove('done');
    document.getElementById('zip-info').textContent = '';
    showToast('上传失败: ' + PortalApi.errorMessage(e, '创建任务失败'), 'err');
  }
}

// 拖放支持
(function () {
  const dz = document.getElementById('dz-zip');
  ['dragenter', 'dragover'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.remove('dragover'); }));
  dz.addEventListener('drop', ev => { if (ev.dataTransfer.files[0]) onZipSelected(ev.dataTransfer.files[0]); });
})();

// ═══════════════════════════════════════════════════════════
// 分类
// ═══════════════════════════════════════════════════════════

async function startClassify() {
  if (!currentTaskId) return;
  document.getElementById('btn-classify').disabled = true;
  document.getElementById('classify-spinner').style.display = '';
  document.getElementById('sec-preview').style.display = 'none';

  try {
    await PortalApi.sendJson(`${API}/tasks/${currentTaskId}/classify`, { method: 'POST' });
    const d = await PortalApi.getJson(`${API}/tasks/${currentTaskId}/preview`);
    previewItems = d.items || [];
    previewSummary = d.summary || {};
    renderPreview(d);
  } catch (e) {
    showToast('分类失败: ' + PortalApi.errorMessage(e, '请求失败'), 'err');
  } finally {
    document.getElementById('btn-classify').disabled = false;
    document.getElementById('classify-spinner').style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════════════
// 预览渲染
// ═══════════════════════════════════════════════════════════

function renderPreview(data) {
  document.getElementById('sec-preview').style.display = '';
  const s = data.summary || {};

  document.getElementById('preview-stats').innerHTML = [
    statCard(s.total || 0, '总文件', '#f3f4f6', '#374151'),
    statCard(s.ok || 0, '成功', '#dcfce7', '#166534'),
    statCard(s.warning || 0, '警告', '#fef3c7', '#92400e'),
    statCard(s.error || 0, '错误', '#fee2e2', '#991b1b'),
    statCard(s.ignored || 0, '忽略', '#f3f4f6', '#6b7280'),
  ].join('');

  const blocking = document.getElementById('preview-blocking');
  if (s.has_blocking_errors) {
    blocking.style.display = '';
    blocking.textContent = `存在 ${s.error} 个阻断错误，请检查接收方或文件分类后重新分类。`;
    document.getElementById('btn-confirm').disabled = true;
  } else {
    blocking.style.display = 'none';
    document.getElementById('btn-confirm').disabled = false;
  }

  switchPreviewGroup('target');
}

function switchPreviewGroup(groupBy, button) {
  document.querySelectorAll('#sec-preview .tab-btn').forEach(b => b.classList.remove('active'));
  if (button) {
    button.classList.add('active');
  } else {
    const fallback = document.querySelector(`#sec-preview .tab-btn[onclick*="'${groupBy}'"]`);
    if (fallback) fallback.classList.add('active');
  }

  const groups = {};
  previewItems.forEach(item => {
    let key;
    if (groupBy === 'target') key = item.target_name_matched || item.target_name_raw || '未匹配';
    else if (groupBy === 'category') key = item.category_name || '未分类';
    else key = item.severity || 'ok';
    (groups[key] = groups[key] || []).push(item);
  });

  const container = document.getElementById('preview-groups');
  container.innerHTML = '';
  for (const [key, items] of Object.entries(groups)) {
    const errorCount = items.filter(i => i.severity === 'error').length;
    const badge = errorCount ? ` <span class="badge badge-error">${errorCount} 错误</span>` : '';
    container.innerHTML += `
      <div class="group-block" onclick="this.classList.toggle('open')">
        <div class="group-head">
          <span class="text-sm font-medium">${esc(key)} (${items.length} 个文件)${badge}</span>
          <span class="group-head-note">展开查看</span>
        </div>
        <div class="group-body">${renderItemTable(items)}</div>
      </div>`;
  }
}

function renderItemTable(items) {
  let html = '<table class="item-table"><tr><th>文件名</th><th>接收方</th><th>文档类型</th><th>路径</th><th>状态</th></tr>';
  items.forEach(i => {
    const sev = i.severity || 'ok';
    const sevBadge = `<span class="badge badge-${sev}">${sev}</span>`;
    const errMsg = i.error_message ? `<div class="status-note-error">${esc(i.error_message)}</div>` : '';
    const warnMsg = i.warning_message ? `<div class="status-note-warn">${esc(i.warning_message)}</div>` : '';
    html += `<tr>
      <td>${esc(i.filename)}${errMsg}${warnMsg}</td>
      <td>${esc(i.target_name_matched || i.target_name_raw || '')}</td>
      <td>${esc(i.document_type || '')}</td>
      <td class="table-path">${esc(i.dst_path || '')}</td>
      <td>${sevBadge}</td>
    </tr>`;
  });
  html += '</table>';
  return html;
}

// ═══════════════════════════════════════════════════════════
// 确认 & 上传
// ═══════════════════════════════════════════════════════════

async function confirmUpload() {
  if (!currentTaskId) return;
  document.getElementById('btn-confirm').disabled = true;

  try {
    await PortalApi.sendJson(`${API}/tasks/${currentTaskId}/confirm`, { method: 'POST' });
  } catch (e) {
    showToast(PortalApi.errorMessage(e, '确认失败'), 'err');
    document.getElementById('btn-confirm').disabled = false;
    return;
  }

  document.getElementById('sec-result').style.display = '';

  try {
    await PortalApi.sendJson(`${API}/tasks/${currentTaskId}/upload`, { method: 'POST' });
  } catch (e) {
    showToast(PortalApi.errorMessage(e, '触发上传失败'), 'err');
    return;
  }

  _uploadDone = 0;
  _uploadTotal = previewItems.filter(i => i.severity === 'ok' || i.severity === 'warning').length || 1;
  _uploadFailed = 0;
  startSSE();
}

// ═══════════════════════════════════════════════════════════
// SSE 进度
// ═══════════════════════════════════════════════════════════

function startSSE() {
  if (_sseSource) { _sseSource.close(); _sseSource = null; }
  _sseSource = new EventSource(`${API}/tasks/${currentTaskId}/progress`);

  _sseSource.onmessage = function (ev) {
    let event;
    try { event = JSON.parse(ev.data); } catch (_) { return; }
    handleProgressEvent(event);
  };

  _sseSource.onerror = function () {
    _sseSource.close();
    _sseSource = null;
  };
}

function handleProgressEvent(event) {
  const type = event.type;

  if (type === 'task_plan') {
    _uploadTotal = event.total_items || _uploadTotal;
  } else if (type === 'item_done') {
    _uploadDone++;
    updateProgressBar();
  } else if (type === 'item_failed') {
    _uploadDone++;
    _uploadFailed++;
    updateProgressBar();
    document.getElementById('btn-retry').style.display = '';
  } else if (type === 'task_done' || type === 'task_failed') {
    if (_sseSource) { _sseSource.close(); _sseSource = null; }
    updateProgressBar();
    loadUploadItems();
    if (type === 'task_failed') {
      showToast('上传任务失败: ' + (event.error || ''), 'err');
    }
  }
}

function updateProgressBar() {
  const pct = _uploadTotal > 0 ? Math.round(_uploadDone / _uploadTotal * 100) : 0;
  document.getElementById('upload-progress-fill').style.width = pct + '%';
  document.getElementById('upload-progress-text').textContent =
    `${_uploadDone}/${_uploadTotal} (${pct}%) — 成功: ${_uploadDone - _uploadFailed}, 失败: ${_uploadFailed}`;

  document.getElementById('upload-stats').innerHTML = [
    statCard(_uploadDone - _uploadFailed, '成功', '#dcfce7', '#166534'),
    statCard(_uploadFailed, '失败', '#fee2e2', '#991b1b'),
    statCard(Math.max(0, _uploadTotal - _uploadDone), '待处理', '#f3f4f6', '#6b7280'),
  ].join('');
}

async function loadUploadItems() {
  let d;
  try {
    d = await PortalApi.getJson(`${API}/tasks/${currentTaskId}/preview`);
  } catch (_) { return; }

  const container = document.getElementById('upload-items');
  let html = '<table class="item-table"><tr><th>文件名</th><th>接收方</th><th>路径</th><th>投递状态</th><th>错误</th></tr>';
  (d.items || []).forEach(i => {
    const st = i.upload_status || 'pending';
    const stCls = (st === 'uploaded') ? 'upload-status-ok' :
                  (st === 'failed') ? 'upload-status-error' : 'upload-status-muted';
    html += `<tr>
      <td>${esc(i.filename)}</td>
      <td>${esc(i.target_name_matched || '')}</td>
      <td class="table-path">${esc(i.dst_path || '')}</td>
      <td class="${stCls}">${esc(st)}</td>
      <td class="status-note-error">${esc(i.upload_error || '')}</td>
    </tr>`;
  });
  html += '</table>';
  container.innerHTML = html;
}

async function retryFailed() {
  if (!currentTaskId) return;
  try {
    await PortalApi.sendJson(`${API}/tasks/${currentTaskId}/retry`, { method: 'POST' });
    await PortalApi.sendJson(`${API}/tasks/${currentTaskId}/upload`, { method: 'POST' });
    _uploadDone = 0; _uploadFailed = 0;
    document.getElementById('btn-retry').style.display = 'none';
    startSSE();
  } catch (e) {
    showToast(PortalApi.errorMessage(e, '重试失败'), 'err');
  }
}

// ═══════════════════════════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════════════════════════

function statCard(num, label, bg, color) {
  return `<div class="stat-card" style="background:${bg}"><div class="num" style="color:${color}">${num}</div><div class="label">${label}</div></div>`;
}
</script>
</body>
</html>
