[project]
name = "control-plane"
version = "0.1.0"
description = "Auto Upload — Control Plane API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "aiosqlite",
    "alembic",
    "pydantic-settings",
    "aioboto3",
    "python-multipart",
    "httpx",
    "aiokafka>=0.14.0",
    "asyncmy>=0.2.11",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "moto[s3]",
    "boto3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# _legacy/ is historical code — not linted until a dedicated clean-up task
exclude = ["_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "unit: fast unit tests with no cross-process dependency",
    "e2e: end-to-end integration tests that use real SQLite and mocked S3",
    "integration: integration tests that cross process or language boundaries",
    "docker: tests that require local docker compose services",
    "mysql: tests that require local MySQL service",
]
